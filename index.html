<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pentax 67 Meter</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background-color: #1a1a1a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #viewfinder-container { flex: 6; position: relative; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #spot-meter { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border: 2px solid #ffcc00; border-radius: 50%; box-shadow: 0 0 0 9999px rgba(0,0,0,0.3); pointer-events: none; }
        
        canvas { display: none; }

        #controls-container { flex: 4; padding: 20px; background: #2a2a2a; display: flex; flex-direction: column; justify-content: space-between; border-top: 2px solid #444; }
        
        .control-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .control-header { display: flex; justify-content: space-between; font-size: 14px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .value-display { font-weight: bold; color: #ffcc00; font-size: 18px; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #ffcc00; cursor: pointer; margin-top: -10px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #555; border-radius: 2px; }
        
        #result-container { text-align: center; margin-top: auto; padding-top: 15px; border-top: 1px solid #444; }
        #shutter-speed { font-size: 48px; font-weight: bold; color: #fff; }
        .label { font-size: 12px; color: #888; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="viewfinder-container">
        <!-- FIXED: Added 'muted' to ensure autoplay works on mobile -->
        <video id="camera-feed" autoplay playsinline muted></video>
        <div id="spot-meter"></div>
        <canvas id="analysis-canvas"></canvas>
    </div>

    <div id="controls-container">
        <div class="control-group">
            <div class="control-header">
                <span>Film ISO</span>
                <span id="iso-display" class="value-display">400</span>
            </div>
            <input type="range" id="iso-slider" min="0" max="6" step="1" value="3">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Aperture (105mm)</span>
                <span id="aperture-display" class="value-display">f/5.6</span>
            </div>
            <input type="range" id="aperture-slider" min="0" max="7" step="1" value="3">
        </div>

        <div id="result-container">
            <div class="label">Shutter Speed</div>
            <div id="shutter-speed">1/125</div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker Registered'));
      }
    </script>
</body>
</html>
